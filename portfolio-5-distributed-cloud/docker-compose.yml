# FundWise PostgreSQL replication (primary + streaming replica)
# Portfolio 5: Distributed and Cloud Database Exercise
# Demo passwords only. Local use.

services:
  primary:
    image: postgres:16
    container_name: fundwise-pg-primary
    environment:
      POSTGRES_PASSWORD: fundwise
      POSTGRES_DB: fundwise
    ports:
      - "5433:5432"
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
      - ./init-primary.sh:/docker-entrypoint-initdb.d/init-primary.sh

  replica:
    image: postgres:16
    container_name: fundwise-pg-replica
    depends_on:
      - primary
    user: postgres
    environment:
      PGPASSWORD: replpass
    ports:
      - "5434:5432"
    volumes:
      - pg_replica_data:/var/lib/postgresql/data
    entrypoint: ["bash", "-c"]
    command:
      - |
        until pg_isready -h primary -U replicator; do sleep 2; done
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          pg_basebackup -h primary -U replicator -D /var/lib/postgresql/data -Fp -Xs -R -P
        fi
        chmod 700 /var/lib/postgresql/data
        exec postgres

volumes:
  pg_primary_data:
  pg_replica_data: